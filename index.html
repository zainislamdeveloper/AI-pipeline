<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Card App</title>
  <style>
    :root {
      --bg: linear-gradient(135deg, #ff9a44, #ffcc33 45%, #ffd86f);
      --card-bg: rgba(255, 255, 255, 0.16);
      --card-border: rgba(255, 255, 255, 0.28);
      --text: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.84);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      transition: background 600ms ease;
      overflow-x: hidden;
    }

    .card {
      width: min(100%, 430px);
      border-radius: 28px;
      padding: 22px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
      transition: transform 240ms ease, box-shadow 240ms ease;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      right: -40px;
      top: -70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.28), rgba(255,255,255,0));
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.34);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .location {
      font-weight: 700;
      font-size: clamp(1.05rem, 2.8vw, 1.35rem);
      letter-spacing: 0.2px;
    }

    .time {
      margin-top: 4px;
      font-size: 0.88rem;
      color: var(--text-soft);
    }

    .toggle {
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 600;
      font-size: 0.86rem;
      padding: 8px 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 200ms ease, background 200ms ease;
    }

    .toggle:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.25);
    }

    .middle {
      margin: 18px 0 20px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
    }

    .icon {
      font-size: clamp(2.9rem, 8vw, 4rem);
      line-height: 1;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.2));
    }

    .condition {
      color: var(--text-soft);
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .temp {
      font-size: clamp(2.2rem, 9vw, 3.2rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .temp-alt {
      margin-top: 6px;
      color: var(--text-soft);
      font-size: 0.93rem;
      font-weight: 600;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 11px 10px;
      transition: background 220ms ease;
    }

    .stat:hover { background: rgba(255, 255, 255, 0.21); }

    .stat-label {
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.45px;
      font-size: 0.77rem;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 700;
    }

    @media (max-width: 375px) {
      .card {
        padding: 18px;
        border-radius: 22px;
      }
      .stats {
        grid-template-columns: 1fr;
      }
      .toggle {
        font-size: 0.8rem;
        padding: 7px 11px;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <header class="top">
      <div>
        <div class="location" id="locationName"></div>
        <div class="time" id="currentTime"></div>
      </div>
      <button class="toggle" id="unitToggle" type="button">Switch to °F</button>
    </header>

    <section class="middle">
      <div class="icon" id="weatherIcon" aria-hidden="true"></div>
      <div>
        <div class="condition" id="conditionText"></div>
        <div class="temp" id="temperature"></div>
        <div class="temp-alt" id="temperatureAlt"></div>
      </div>
    </section>

    <section class="stats">
      <article class="stat">
        <div class="stat-label">Feels Like</div>
        <div class="stat-value" id="feelsLike"></div>
      </article>
      <article class="stat">
        <div class="stat-label">Humidity</div>
        <div class="stat-value" id="humidity"></div>
      </article>
      <article class="stat">
        <div class="stat-label">Wind</div>
        <div class="stat-value" id="wind"></div>
      </article>
    </section>
  </main>

  <script src="utils.js"></script>
  <script>
    const { celsiusToFahrenheit, formatWindSpeed, getHumidityLabel, getWeatherGradient } = window.Utils;

    const weather = {
      location: "Lisbon, Portugal",
      condition: "Sunny",
      tempC: 27,
      feelsLikeC: 29,
      humidity: 58,
      windKmh: 16
    };

    const icons = {
      sunny: "☀️",
      clear: "🌙",
      cloudy: "☁️",
      rain: "🌧️",
      storm: "⛈️",
      snow: "❄️",
      mist: "🌫️",
      fallback: "🌤️"
    };

    let unit = "C";

    const el = {
      location: document.getElementById("locationName"),
      time: document.getElementById("currentTime"),
      icon: document.getElementById("weatherIcon"),
      condition: document.getElementById("conditionText"),
      temp: document.getElementById("temperature"),
      tempAlt: document.getElementById("temperatureAlt"),
      feelsLike: document.getElementById("feelsLike"),
      humidity: document.getElementById("humidity"),
      wind: document.getElementById("wind"),
      toggle: document.getElementById("unitToggle")
    };

    function getIcon(conditionText) {
      const key = String(conditionText).toLowerCase();
      if (key.includes("sun")) return icons.sunny;
      if (key.includes("clear")) return icons.clear;
      if (key.includes("cloud")) return icons.cloudy;
      if (key.includes("rain") || key.includes("drizzle")) return icons.rain;
      if (key.includes("storm") || key.includes("thunder")) return icons.storm;
      if (key.includes("snow") || key.includes("sleet")) return icons.snow;
      if (key.includes("mist") || key.includes("fog")) return icons.mist;
      return icons.fallback;
    }

    function renderDateTime() {
      const now = new Date();
      el.time.textContent = now.toLocaleString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderWeather() {
      const tempF = celsiusToFahrenheit(weather.tempC);
      const feelsLikeF = celsiusToFahrenheit(weather.feelsLikeC);
      const isC = unit === "C";

      el.location.textContent = weather.location;
      el.condition.textContent = weather.condition;
      el.icon.textContent = getIcon(weather.condition);
      el.temp.textContent = isC ? `${weather.tempC}°C` : `${tempF}°F`;
      el.tempAlt.textContent = isC ? `Also: ${tempF}°F` : `Also: ${weather.tempC}°C`;
      el.feelsLike.textContent = isC ? `${weather.feelsLikeC}°C` : `${feelsLikeF}°F`;
      el.humidity.textContent = `${weather.humidity}% • ${getHumidityLabel(weather.humidity)}`;
      el.wind.textContent = formatWindSpeed(weather.windKmh, "km/h");
      el.toggle.textContent = isC ? "Switch to °F" : "Switch to °C";

      document.body.style.background = getWeatherGradient(weather.condition);
    }

    el.toggle.addEventListener("click", function () {
      unit = unit === "C" ? "F" : "C";
      renderWeather();
    });

    renderDateTime();
    renderWeather();
    setInterval(renderDateTime, 1000);
  </script>
</body>
</html>
