<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Card App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .weather-card {
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      color: white;
      transition: all 0.5s ease;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .location-info {
      flex: 1;
    }

    .location {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .date-time {
      font-size: 12px;
      opacity: 0.85;
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.25);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    .toggle-btn:active {
      transform: translateY(0);
    }

    .weather-icon {
      font-size: 80px;
      text-align: center;
      margin: 20px 0;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .condition {
      text-align: center;
      font-size: 18px;
      margin-bottom: 15px;
      text-transform: capitalize;
      opacity: 0.9;
    }

    .temperature-display {
      text-align: center;
      margin: 20px 0;
    }

    .main-temp {
      font-size: 56px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .feels-like {
      font-size: 14px;
      opacity: 0.85;
    }

    .weather-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .detail-item {
      text-align: center;
    }

    .detail-label {
      font-size: 12px;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .detail-value {
      font-size: 22px;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .weather-card {
        padding: 20px;
      }

      .location {
        font-size: 20px;
      }

      .main-temp {
        font-size: 48px;
      }

      .weather-icon {
        font-size: 60px;
      }

      .weather-details {
        gap: 15px;
      }

      .detail-value {
        font-size: 18px;
      }

      .toggle-btn {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="weather-card">
      <div class="card-header">
        <div class="location-info">
          <div class="location" id="location">San Francisco</div>
          <div class="date-time" id="dateTime"></div>
        </div>
        <button class="toggle-btn" id="toggleBtn">°F</button>
      </div>

      <div class="weather-icon" id="weatherIcon">☀️</div>
      <div class="condition" id="condition">Sunny</div>

      <div class="temperature-display">
        <div class="main-temp" id="temperature">24°C</div>
        <div class="feels-like" id="feelsLike">Feels like 22°C</div>
      </div>

      <div class="weather-details">
        <div class="detail-item">
          <div class="detail-label">Humidity</div>
          <div class="detail-value" id="humidity">65%</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Wind</div>
          <div class="detail-value" id="windSpeed">12 km/h</div>
        </div>
      </div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script>
    const weatherData = {
      location: 'San Francisco',
      condition: 'sunny',
      temperature: 24,
      feelsLike: 22,
      humidity: 65,
      windSpeed: 12,
    };

    let isCelsius = true;

    const elements = {
      card: document.querySelector('.weather-card'),
      location: document.getElementById('location'),
      dateTime: document.getElementById('dateTime'),
      toggleBtn: document.getElementById('toggleBtn'),
      weatherIcon: document.getElementById('weatherIcon'),
      condition: document.getElementById('condition'),
      temperature: document.getElementById('temperature'),
      feelsLike: document.getElementById('feelsLike'),
      humidity: document.getElementById('humidity'),
      windSpeed: document.getElementById('windSpeed'),
    };

    function updateDateTime() {
      const now = new Date();
      const options = {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      };
      elements.dateTime.textContent = now.toLocaleDateString('en-US', options);
    }

    function updateDisplay() {
      const tempC = weatherData.temperature;
      const tempF = celsiusToFahrenheit(tempC);
      const feelsLikeC = weatherData.feelsLike;
      const feelsLikeF = celsiusToFahrenheit(feelsLikeC);

      const displayTemp = isCelsius ? tempC : tempF;
      const displayFeelsLike = isCelsius ? feelsLikeC : feelsLikeF;
      const unitSymbol = isCelsius ? '°C' : '°F';

      elements.temperature.textContent = `${displayTemp}${unitSymbol}`;
      elements.feelsLike.textContent = `Feels like ${displayFeelsLike}${unitSymbol}`;
      elements.toggleBtn.textContent = isCelsius ? '°F' : '°C';
    }

    function initializeCard() {
      elements.location.textContent = weatherData.location;
      elements.weatherIcon.textContent = getWeatherIcon(weatherData.condition);
      elements.condition.textContent = weatherData.condition;
      elements.humidity.textContent = `${weatherData.humidity}%`;
      elements.windSpeed.textContent = `${formatWindSpeed(weatherData.windSpeed)} km/h`;
      
      const gradient = getWeatherGradient(weatherData.condition);
      elements.card.style.background = gradient;

      updateDateTime();
      updateDisplay();
    }

    elements.toggleBtn.addEventListener('click', () => {
      isCelsius = !isCelsius;
      updateDisplay();
    });

    setInterval(updateDateTime, 60000);

    initializeCard();
  </script>
</body>
</html>
