<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Card App</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.25);
      --text-main: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.82);
      --text-muted: rgba(255, 255, 255, 0.66);
      --shadow: 0 20px 55px rgba(0, 0, 0, 0.35);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      transition: background 500ms ease;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.32), transparent 38%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.2), transparent 44%);
      animation: drift 8s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    .card {
      width: min(100%, 420px);
      border-radius: 28px;
      border: 1px solid var(--card-border);
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.20), rgba(255, 255, 255, 0.07));
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      overflow: hidden;
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.42);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding: 22px 22px 8px;
    }

    .location {
      font-weight: 750;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
    }

    .datetime {
      margin-top: 4px;
      color: var(--text-soft);
      font-size: 0.85rem;
    }

    .toggle {
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-weight: 650;
      font-size: 0.82rem;
      border-radius: 999px;
      padding: 8px 13px;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
      white-space: nowrap;
    }

    .toggle:hover { background: rgba(255, 255, 255, 0.26); }
    .toggle:active { transform: scale(0.97); }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 22px 16px;
    }

    .temp-wrap { min-width: 0; }

    .temp {
      line-height: 1;
      font-size: clamp(3.4rem, 11vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      text-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
    }

    .secondary-temp {
      margin-top: 6px;
      font-size: 0.95rem;
      color: var(--text-soft);
    }

    .condition {
      margin-top: 10px;
      font-size: 1rem;
      color: var(--text-soft);
      font-weight: 600;
    }

    .icon {
      font-size: clamp(3rem, 13vw, 4.3rem);
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.2));
    }

    .stats {
      padding: 0 16px 16px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.13);
      padding: 12px 10px;
      min-height: 84px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: background 200ms ease;
    }

    .stat:hover { background: rgba(255, 255, 255, 0.2); }

    .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }

    .value {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      word-break: break-word;
    }

    @media (max-width: 400px) {
      .top, .hero { padding-left: 16px; padding-right: 16px; }
      .stats { padding: 0 12px 12px; gap: 8px; }
      .stat { padding: 10px 8px; min-height: 76px; }
      .value { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="backdrop"></div>

  <main class="card" aria-label="Current weather card">
    <section class="top">
      <div>
        <div id="location" class="location"></div>
        <div id="datetime" class="datetime"></div>
      </div>
      <button id="toggle" class="toggle" type="button">Switch to °F</button>
    </section>

    <section class="hero">
      <div class="temp-wrap">
        <div id="temperature" class="temp"></div>
        <div id="secondaryTemp" class="secondary-temp"></div>
        <div id="condition" class="condition"></div>
      </div>
      <div id="icon" class="icon" aria-label="Weather icon"></div>
    </section>

    <section class="stats">
      <article class="stat">
        <div class="label">Feels Like</div>
        <div id="feelsLike" class="value"></div>
      </article>
      <article class="stat">
        <div class="label">Humidity</div>
        <div id="humidity" class="value"></div>
      </article>
      <article class="stat">
        <div class="label">Wind</div>
        <div id="wind" class="value"></div>
      </article>
    </section>
  </main>

  <script src="utils.js"></script>
  <script>
    (function () {
      const weather = {
        location: "Nairobi, KE",
        condition: "Partly Cloudy",
        temperatureC: 24,
        feelsLikeC: 26,
        humidity: 64,
        windSpeedKmh: 18
      };

      let unit = "C";

      const el = {
        location: document.getElementById("location"),
        datetime: document.getElementById("datetime"),
        temperature: document.getElementById("temperature"),
        secondaryTemp: document.getElementById("secondaryTemp"),
        condition: document.getElementById("condition"),
        icon: document.getElementById("icon"),
        feelsLike: document.getElementById("feelsLike"),
        humidity: document.getElementById("humidity"),
        wind: document.getElementById("wind"),
        toggle: document.getElementById("toggle")
      };

      function getIcon(condition) {
        const c = String(condition).toLowerCase();
        if (c.includes("sun") || c.includes("clear")) return "☀️";
        if (c.includes("partly")) return "⛅";
        if (c.includes("cloud")) return "☁️";
        if (c.includes("rain") || c.includes("drizzle") || c.includes("shower")) return "🌧️";
        if (c.includes("storm") || c.includes("thunder")) return "⛈️";
        if (c.includes("snow") || c.includes("sleet")) return "❄️";
        if (c.includes("fog") || c.includes("mist") || c.includes("haze")) return "🌫️";
        return "🌤️";
      }

      function formatTemp(c) {
        return unit === "C" ? Math.round(c) + "°C" : celsiusToFahrenheit(c) + "°F";
      }

      function formatSecondary(c) {
        return unit === "C"
          ? celsiusToFahrenheit(c) + "°F"
          : Math.round(c) + "°C";
      }

      function renderDateTime() {
        const now = new Date();
        el.datetime.textContent = now.toLocaleString(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function render() {
        document.body.style.background = getWeatherGradient(weather.condition);
        el.location.textContent = weather.location;
        el.temperature.textContent = formatTemp(weather.temperatureC);
        el.secondaryTemp.textContent = "Also " + formatSecondary(weather.temperatureC);
        el.condition.textContent = weather.condition;
        el.icon.textContent = getIcon(weather.condition);
        el.feelsLike.textContent = formatTemp(weather.feelsLikeC);
        el.humidity.textContent = weather.humidity + "% • " + getHumidityLabel(weather.humidity);
        el.wind.textContent = formatWindSpeed(weather.windSpeedKmh);
        el.toggle.textContent = unit === "C" ? "Switch to °F" : "Switch to °C";
        renderDateTime();
      }

      el.toggle.addEventListener("click", function () {
        unit = unit === "C" ? "F" : "C";
        render();
      });

      render();
      setInterval(renderDateTime, 30000);
    }());
  </script>
</body>
</html>
